<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;-webkit-app-region:drag;user-select:none}
body{background:linear-gradient(#183049,#0b1822);color:#e4edf5;font-family:'Segoe UI Variable','Segoe UI',sans-serif;display:flex;align-items:center;gap:28px;padding:0 40px;border:2px solid #3fd0b0;box-sizing:border-box}
img{width:150px;height:150px}
h1{margin:0;font:700 40px Bahnschrift,'Segoe UI',sans-serif;color:#3fd0b0}
p{margin:4px 0 22px;color:#8aa3b8}
.bar{width:240px;height:6px;background:#0e1c2a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#3fd0b0;animation:l 2.4s ease-out forwards}
@keyframes l{to{width:100%}}
</style></head><body>
<img src="assets/logo.png" alt="Cityforge logo">
<div><h1>Cityforge 2</h1><p>Loading your city...</p><div class="bar"><i></i></div></div>
