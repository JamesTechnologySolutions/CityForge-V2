name: Build CityForge for Windows
on:
  workflow_dispatch:
  push:
    branches: [cityforge-complete-source]
    paths:
      - 'main.js'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/build-v2.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: npm test
      - name: Build installer and portable application
        run: npm run dist
      - name: Upload Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: CityForge-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14